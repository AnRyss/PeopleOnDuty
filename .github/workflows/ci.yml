name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore PeopleOnDuty.slnx

    - name: Build
      run: dotnet build PeopleOnDuty.slnx --no-restore --configuration Release

    - name: Run tests
      run: dotnet test tests/PeopleOnDuty.Tests.csproj --no-build --configuration Release --verbosity normal
